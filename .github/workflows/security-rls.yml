name: Supabase RLS Security Regression

on:
  push:
    branches: [main, dev]
    paths:
      - 'supabase/**'
      - 'scripts/check-supabase-migration-grants.ps1'
      - '.github/workflows/security-rls.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'supabase/**'
      - 'scripts/check-supabase-migration-grants.ps1'
      - '.github/workflows/security-rls.yml'

jobs:
  rls_security:
    name: PostgreSQL attacker-policy tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Ephemeral runner-only database; avoids committing even a fixture password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate explicit Data API grants
        shell: pwsh
        run: ./scripts/check-supabase-migration-grants.ps1

      - name: Validate migration version contract
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          invalid=0
          declare -A seen=()
          for migration in "${migrations[@]}"; do
            if [[ ! "$migration" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error file=supabase/migrations/$migration::Migration filename must use a unique 14-digit timestamp and snake_case name"
              invalid=1
              continue
            fi
            version="${migration%%_*}"
            if [[ -n "${seen[$version]:-}" ]]; then
              echo "::error file=supabase/migrations/$migration::Duplicate migration version $version (also used by ${seen[$version]})"
              invalid=1
            fi
            seen[$version]="$migration"
          done
          if (( invalid != 0 )); then
            exit 1
          fi
          echo "Validated ${#migrations[@]} uniquely versioned migrations."

      - name: Create isolated test database
        run: createdb journeysync_rls_test

      - name: Test production migration-history normalization
        run: psql -v ON_ERROR_STOP=1 -d journeysync_rls_test -f supabase/tests/migration_history_normalization_regression.sql

      - name: Test mixed legacy identity migrations
        run: psql -v ON_ERROR_STOP=1 -d journeysync_rls_test -f supabase/tests/mixed_identity_migration_regression.sql

      - name: Create representative legacy schema
        run: psql -v ON_ERROR_STOP=1 -d journeysync_rls_test -f supabase/tests/rls_fixture.sql

      - name: Apply forward security migration
        run: psql -v ON_ERROR_STOP=1 -d journeysync_rls_test -f supabase/migrations/20261010000000_production_rls_security_hardening.sql

      - name: Apply owner-only admin authorization migration
        run: psql -v ON_ERROR_STOP=1 -d journeysync_rls_test -f supabase/migrations/20261017000000_owner_only_admin_authorization.sql

      - name: Apply future Data API default-deny migration
        run: psql -v ON_ERROR_STOP=1 -d journeysync_rls_test -f supabase/migrations/20261018000000_default_deny_future_data_api_objects.sql

      - name: Test future Data API default privileges
        run: psql -v ON_ERROR_STOP=1 -d journeysync_rls_test -f supabase/tests/default_privileges_regression.sql

      - name: Test owner-only admin authorization
        run: psql -v ON_ERROR_STOP=1 -d journeysync_rls_test -f supabase/tests/admin_owner_authorization_regression.sql

      - name: Run attacker and regression assertions
        run: psql -v ON_ERROR_STOP=1 -d journeysync_rls_test -f supabase/tests/rls_security_regression.sql

      - name: Validate production verification SQL
        run: psql -v ON_ERROR_STOP=1 -d journeysync_rls_test -f supabase/production_rls_verification.sql

      - name: Test production-style bigint profile identity
        run: |
          createdb journeysync_rls_bigint_test
          psql -v ON_ERROR_STOP=1 -d journeysync_rls_bigint_test -f supabase/tests/rls_bigint_identity_fixture.sql
          psql -v ON_ERROR_STOP=1 -d journeysync_rls_bigint_test -f supabase/migrations/20260630000000_production_release_hardening.sql
          psql -v ON_ERROR_STOP=1 -d journeysync_rls_bigint_test -f supabase/migrations/20261010000000_production_rls_security_hardening.sql
          psql -v ON_ERROR_STOP=1 -d journeysync_rls_bigint_test -f supabase/tests/rls_bigint_identity_regression.sql
