<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#db7706", // Burnt Orange
              "primary-dark": "#b45f04",

<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
  html { scroll-behavior: smooth; }
  /* Force-hide scrollbars on root elements (most browsers) while preserving scroll behavior. */
  html, body {
    -ms-overflow-style: none; /* IE and Edge */
    scrollbar-width: none; /* Firefox */
  }
  html::-webkit-scrollbar, body::-webkit-scrollbar {
    display: none; /* Safari and Chrome */
    width: 0;
    height: 0;
  }
  /* Also support the toggle class to hide scrollbars on descendant scrollable elements. */
  html.hide-scrollbar, body.hide-scrollbar, .hide-scrollbar * {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  html.hide-scrollbar::-webkit-scrollbar, body.hide-scrollbar::-webkit-scrollbar, .hide-scrollbar *::-webkit-scrollbar {
    width: 0;
    height: 0;
  }
        .glass-header {
            background: rgba(244, 239, 234, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .map-texture {

              radial-gradient(circle at top right, rgba(219, 119, 6, 0.28), transparent 28%),
              radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.08), transparent 24%);
        }
    </style>

</head>
